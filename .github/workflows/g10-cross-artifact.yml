name: G10 cross artifact reader
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  packages: read
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Download primary private artifact
        uses: actions/download-artifact@v4
        with:
          name: g10-file-boundary-30856035375
          repository: apexblack-koala-274804/chainship-private-test
          run-id: 30856035375
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out
      - name: Read primary private npm package
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$TOKEN" > "$HOME/.npmrc"
          npm view @apexblack-koala-274804/g10-npm-30853164675 --registry=https://npm.pkg.github.com
