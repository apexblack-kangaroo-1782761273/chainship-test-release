name: G10 npm cross-account package reader
on:
  push:
    paths:
      - .github/workflows/g10-npm-cross-read.yml
permissions:
  contents: read
  packages: read
jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - name: Read primary package as secondary actor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          mkdir -p /tmp/g10npmrc /tmp/g10npmread
          printf '%s\n' "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" > /tmp/g10npmrc/config
          cd /tmp/g10npmread
          NPM_CONFIG_USERCONFIG=/tmp/g10npmrc/config npm pack @apexblack-koala-274804/g10-npm-30862288341@3.0.0 --registry=https://npm.pkg.github.com
          tarball=$(find . -maxdepth 1 -name '*.tgz' -print -quit)
          tar -xzf "$tarball"
          test -f package/primary-runtime-token.txt
          awk '{print "primary_token_length=" length($0)}' package/primary-runtime-token.txt
          cat package/package.json
          printf 'secondary-package-reader-control\n' > /tmp/g10npmread/control.txt
